# Déploiement du site sur GitHub Pages
# Après push sur main, le site est buildé et publié.
# Domaine personnalisé : configurer dans Settings > Pages > Custom domain (ex. sausset-reuni.fr)

name: Deploy on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # URL du site pour sitemap/SEO (défaut : https://sausset-reuni.fr)
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          # Base path : laisser vide pour GitHub Pages (/saussetreuni/) ; mettre / pour domaine à la racine
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          # Google Analytics 4 (optionnel) — ID de mesure G-XXXXXXXXXX
          VITE_GA4_MEASUREMENT_ID: ${{ vars.VITE_GA4_MEASUREMENT_ID }}

      - name: Copy index.html to 404.html (SPA routing on GitHub Pages)
        run: cp dist/index.html dist/404.html
      - name: Copy programme PDF with URL-safe name (évite 404 en iframe)
        run: 'cp "dist/Sausset Reuni 2026 - Le programme.pdf" "dist/programme-sausset-reuni-2026.pdf"'

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
